<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tap2ETH Terminal</title>
  <style>
    /* NeoBrutalism, same as the phone app: thick black borders, hard offset shadows, flat electric colour. */
    :root { --paper: #FFFEF0; --ink: #0A0A0A; --yellow: #FFE600; --cyan: #00C2CB; --pink: #FF3EA5; --green: #00C853; --muted: #5A5A5A; --b: 3px solid var(--ink); }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: "Arial Black", "Helvetica Neue", system-ui, sans-serif; font-weight: 800; background: var(--paper); color: var(--ink); user-select: none; -webkit-tap-highlight-color: transparent; }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.on { display: flex; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; text-transform: uppercase; background: #fff; border: var(--b); box-shadow: 4px 4px 0 var(--ink); }
    /* Pressing sinks a button into the page: it moves by the size of its shadow and the shadow goes. */
    button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }

    /* ---------- amount entry ---------- */
    #s-entry { padding: 12px; gap: 14px; background: var(--paper); }
    .entry-left { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .merchant { align-self: flex-start; background: var(--yellow); border: var(--b); box-shadow: 3px 3px 0 var(--ink); padding: 3px 9px; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
    .amount { background: #fff; border: var(--b); box-shadow: 5px 5px 0 var(--ink); padding: 8px 12px; font-size: 44px; font-weight: 900; letter-spacing: -1px; line-height: 1; word-break: break-all; display: flex; align-items: baseline; gap: 8px; }
    .amount .cur, .big .cur { font-size: 13px; font-weight: 900; letter-spacing: 0; background: var(--cyan); border: 2.5px solid var(--ink); padding: 2px 6px; }
    .amount.empty { color: #B8B8A8; }
    .hint { margin-top: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
    .charge { width: 100%; padding: 12px 8px; background: var(--green); font-size: 22px; font-weight: 900; box-shadow: 5px 5px 0 var(--ink); }
    .charge[disabled] { background: #E7E6D6; color: #9A9A8A; box-shadow: 5px 5px 0 #9A9A8A; border-color: #9A9A8A; cursor: default; }
    .charge[disabled]:active { transform: none; }
    .pad { width: 216px; flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 9px; padding: 0 5px 5px 0; }
    .pad button { font-size: 24px; font-weight: 900; box-shadow: 3px 3px 0 var(--ink); }
    .pad button:active { transform: translate(3px, 3px); }
    .pad .del { background: var(--pink); font-size: 18px; font-weight: 900; letter-spacing: .5px; }

    /* volume: 0 is mute, 10 is loudest */
    .vol { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
    .vol-l { font-size: 11px; text-transform: uppercase; }
    .vol button { width: 28px; height: 28px; padding: 0; font-size: 18px; font-weight: 900; line-height: 1; box-shadow: 2px 2px 0 var(--ink); }
    .vol button:active { transform: translate(2px, 2px); }
    .meter { display: flex; gap: 2px; flex: 1; max-width: 120px; height: 20px; border: var(--b); background: #fff; padding: 2px; }
    .meter i { flex: 1; background: #ECEBDD; }
    .meter i.on { background: var(--ink); }
    .meter i.on.hot { background: var(--pink); }
    .vol-n { min-width: 20px; font-size: 15px; font-weight: 900; text-align: center; }

    /* ---------- tap / waiting / result ---------- */
    .center { flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px 20px; gap: 8px; }
    .big { display: inline-flex; align-items: baseline; gap: 8px; background: #fff; border: var(--b); box-shadow: 5px 5px 0 var(--ink); padding: 4px 16px; font-size: 40px; font-weight: 900; letter-spacing: -1px; }
    .title { font-size: 24px; font-weight: 900; text-transform: uppercase; }
    .sub { font-size: 13px; font-weight: 800; max-width: 400px; line-height: 1.3; min-height: 18px; }
    .ghost { margin-top: 8px; padding: 8px 22px; font-size: 13px; font-weight: 900; }

    #s-tap { background: var(--yellow); }
    #s-phone { background: var(--cyan); }
    #s-paid { background: var(--green); }
    #s-declined { background: var(--pink); }

    /* contactless mark with pulsing rings */
    .tapmark { position: relative; width: 130px; height: 84px; margin-bottom: 6px; }
    .card { position: absolute; left: 8px; top: 8px; width: 100px; height: 64px; background: #fff; border: var(--b); box-shadow: 5px 5px 0 var(--ink); }
    .card::before { content: ""; position: absolute; left: 10px; top: 18px; width: 26px; height: 20px; background: var(--cyan); border: 2.5px solid var(--ink); }
    .card::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 8px; height: 5px; background: var(--ink); }
    .ring { position: absolute; right: -2px; top: 50%; width: 22px; height: 22px; border: 4px solid var(--ink); border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform: translateY(-50%) rotate(45deg); opacity: 0; animation: ring 1.6s ease-out infinite; }
    .ring.r2 { width: 36px; height: 36px; right: -9px; animation-delay: .25s; }
    .ring.r3 { width: 50px; height: 50px; right: -16px; animation-delay: .5s; }
    @keyframes ring { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    .busy .ring { animation-duration: .7s; }

    .phone { width: 48px; height: 78px; background: #fff; border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); display: grid; place-items: center; margin-bottom: 8px; animation: buzz 1.4s ease-in-out infinite; }
    .phone::after { content: ""; width: 22px; height: 26px; border-radius: 50%; background: var(--pink); border: 3px solid var(--ink); }
    @keyframes buzz { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-6deg); } 85% { transform: rotate(6deg); } }

    .badge { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 6px; background: #fff; border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
    .badge svg { width: 42px; height: 42px; }
    .tx { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; background: #fff; border: 2.5px solid var(--ink); padding: 2px 8px; word-break: break-all; max-width: 420px; }
    .tx:empty { display: none; }
    #declined-why:empty { display: none; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>

  <!-- 1. Merchant types the amount -->
  <section class="screen on" id="s-entry">
    <div class="entry-left">
      <div class="merchant">Tap2ETH Café · new bill</div>
      <div>
        <div class="amount empty" id="amount">0<span class="cur">USDT</span></div>
        <div class="hint" id="entry-hint">Enter the amount</div>
      </div>
      <div>
        <button class="charge" id="charge" disabled>Charge</button>
        <div class="vol">
          <span class="vol-l">Vol</span>
          <button id="vol-dn" aria-label="Quieter">−</button>
          <div class="meter" id="meter"></div>
          <button id="vol-up" aria-label="Louder">+</button>
          <span class="vol-n" id="vol-n">5</span>
        </div>
      </div>
    </div>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 2. Customer taps the card -->
  <section class="screen center" id="s-tap">
    <div class="tapmark" id="tapmark"><div class="card"></div><span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span></div>
    <div class="big" id="tap-amount">0 <span class="cur">USDT</span></div>
    <div class="title" id="tap-title">Tap your card</div>
    <div class="sub" id="tap-sub">Hold it flat on the reader until you're told to remove it</div>
    <button class="ghost" id="cancel-tap">Cancel</button>
  </section>

  <!-- 3. Waiting for the customer's phone -->
  <section class="screen center" id="s-phone">
    <div class="phone"></div>
    <div class="title">Approve on your phone</div>
    <div class="sub" id="phone-sub">Card read. Confirm the payment with your fingerprint.</div>
    <button class="ghost" id="cancel-phone">Cancel bill</button>
  </section>

  <!-- 4a. Paid -->
  <section class="screen center" id="s-paid">
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/></svg></div>
    <div class="big" id="paid-amount">0 <span class="cur">USDT</span></div>
    <div class="title">Paid</div>
    <div class="tx" id="paid-tx"></div>
  </section>

  <!-- 4b. Declined -->
  <section class="screen center" id="s-declined">
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="square"/></svg></div>
    <div class="title">Payment declined</div>
    <div class="sub" id="declined-why"></div>
    <button class="ghost" id="declined-ok">New bill</button>
  </section>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (p, body) => fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
  let entry = "", linkMode = false, last = "", resetTimer;

  // ---- keypad
  for (const k of ["1","2","3","4","5","6","7","8","9",".","0","⌫"]) {
    const b = document.createElement("button");
    b.textContent = k === "⌫" ? "DEL" : k;  // a bold word reads better on pink than the thin ⌫ glyph
    if (k === "⌫") b.className = "del";
    b.onclick = () => press(k);
    $("pad").appendChild(b);
  }
  function press(k) {
    post("/key", { key: k }).catch(() => {});  // sound only, so a lost press doesn't matter
    if (k === "⌫") entry = entry.slice(0, -1);
    else if (k === "." && (linkMode || entry.includes("."))) return;
    else if (entry.length < (linkMode ? 4 : 7) && !(entry.includes(".") && entry.split(".")[1].length >= 2)) entry = (entry === "0" && k !== ".") ? k : entry + k;
    drawEntry();
  }
  function drawEntry() {
    const shown = entry || (linkMode ? "····" : "0");
    $("amount").innerHTML = linkMode ? shown : `${shown}<span class="cur">USDT</span>`;
    $("amount").classList.toggle("empty", !entry);
    $("entry-hint").textContent = linkMode ? "Enter the 4-digit code from the customer's phone" : "Enter the amount";
    $("charge").textContent = linkMode ? "Link card" : "Charge";
    $("charge").disabled = linkMode ? entry.length !== 4 : !(Number(entry) > 0);
  }
  $("charge").onclick = () => {
    if (linkMode) post("/register", { code: entry });
    else post("/pay", { amount: entry });
    entry = ""; linkMode = false; drawEntry();
  };
  // ---- volume (0 mute .. 10 loudest), kept on the terminal so it survives a restart
  let vol = 5, volHold = 0;
  for (let i = 0; i < 10; i++) $("meter").appendChild(document.createElement("i"));
  function drawVol() {
    [...$("meter").children].forEach((c, i) => { c.classList.toggle("on", i < vol); c.classList.toggle("hot", i >= 7); });
    $("vol-n").textContent = vol;
  }
  function setVol(n) {
    vol = Math.max(0, Math.min(10, n));
    volHold = Date.now() + 800;  // ignore the next few state polls so the meter doesn't flicker back
    drawVol();
    post("/volume", { level: vol }).catch(() => {});
  }
  $("vol-dn").onclick = () => setVol(vol - 1);
  $("vol-up").onclick = () => setVol(vol + 1);
  drawVol();

  const cancel = () => post("/cancel");
  $("cancel-tap").onclick = cancel;
  $("cancel-phone").onclick = cancel;
  $("declined-ok").onclick = cancel;

  // ---- plain-language reasons
  function why(s) {
    const d = String(s.detail || "");
    if (/OverLimit/.test(d)) return "Over the customer's spending limit.";
    if (/IsFrozen/.test(d)) return "The customer's wallet is frozen.";
    if (/rejected/.test(d)) return "The customer declined on their phone.";
    if (/not registered/.test(d)) return "This card isn't linked to a Tap2ETH wallet yet.";
    if (/Expired/.test(d)) return "The request timed out. Start a new bill.";
    if (/BadCardSignature|BadPhoneSignature/.test(d)) return "The signatures didn't match this wallet.";
    return d || "Something went wrong. Start a new bill.";
  }
  const fmt = (a) => Number(a).toLocaleString("en-IN", { maximumFractionDigits: 2 });

  // ---- state → screen
  function show(id) { for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id); }
  async function tick() {
    let s;
    try { s = await (await fetch("/state")).json(); } catch { return; }
    if (typeof s.volume === "number" && s.volume !== vol && Date.now() > volHold) { vol = s.volume; drawVol(); }
    const key = JSON.stringify([s.mode, s.detail, s.ok, s.tx]);
    if (key === last) return;
    last = key;
    clearTimeout(resetTimer);
    if (s.mode === "idle") return show("s-entry");
    if (s.mode === "pay" || s.mode === "register") {
      const reading = /Reading|Almost/.test(s.detail || "");
      $("tap-amount").innerHTML = s.mode === "pay" ? `${fmt(s.amount)} <span class="cur">USDT</span>` : `Code ${s.code}`;
      $("tap-title").textContent = reading ? "Keep holding…" : s.mode === "pay" ? "Tap your card" : "Tap the card to link";
      $("tap-sub").textContent = reading ? "Reading your card. Don't move it." : /Couldn't|tap again/.test(s.detail || "") ? "Couldn't read it. Hold the card flat on the reader and keep it still." : "Hold it flat on the reader until you're told to remove it";
      $("tapmark").classList.toggle("busy", reading);
      return show("s-tap");
    }
    if (s.mode === "waiting") { $("phone-sub").textContent = `${fmt(s.amount)} USDT · card read. You can remove the card now.`; return show("s-phone"); }
    if (s.ok === true) {
      $("paid-amount").innerHTML = s.amount ? `${fmt(s.amount)} <span class="cur">USDT</span>` : "Card linked";
      $("paid-tx").textContent = s.tx ? "tx " + s.tx.slice(0, 18) + "…" + s.tx.slice(-6) : (s.detail || "");
      show("s-paid");
      resetTimer = setTimeout(cancel, 6000);
      return;
    }
    if (s.ok === false) { $("declined-why").textContent = why(s); show("s-declined"); resetTimer = setTimeout(cancel, 9000); }
  }
  setInterval(tick, 150);
  drawEntry();
  tick();
</script>
</body>
</html>
